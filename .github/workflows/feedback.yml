name: Handle website feedback
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  feedback:
    if: startsWith(github.event.issue.title, '[feedback]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/feedback.js
        env:
          GH_TOKEN: ${{ github.token }}
